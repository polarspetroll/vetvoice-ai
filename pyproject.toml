[project]
name = "vetvoice"
version = "0.1.0"
description = "Real-time AI phone receptionist for a vet clinic"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[deepgram,anthropic,elevenlabs,silero,turn-detector,mcp]~=1.8",
    "livekit-api>=1.2",
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "faker>=30",
    "twilio>=9",
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
    "numpy>=2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
